services:
  website:
    image: ${WEBSITE_IMAGE:-website:latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      AUTH_SECRET: ${AUTH_SECRET}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-${AUTH_SECRET}}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_MEDIA_BASE_URL: ${NEXT_PUBLIC_MEDIA_BASE_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_REQUIRED_MEDIA_ROLES: ${KEYCLOAK_REQUIRED_MEDIA_ROLES:-owner,media_admin}
      KEYCLOAK_ROLE_CLAIM_PATH: ${KEYCLOAK_ROLE_CLAIM_PATH:-resource_access.website.roles}
      KEYCLOAK_ADMIN_REALM: ${KEYCLOAK_ADMIN_REALM}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-}
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET}
      OAUTH2_PROXY_REDIRECT_URL: ${OAUTH2_PROXY_REDIRECT_URL}
      BAO_ADDR: ${BAO_ADDR}
      BAO_KV_MOUNT: ${BAO_KV_MOUNT:-kv}
      BAO_SECRET_PATH_WEBSITE: ${BAO_SECRET_PATH_WEBSITE:-website/prod}
      BAO_SECRET_PATH_RUSTFS: ${BAO_SECRET_PATH_RUSTFS:-rustfs/prod}
      BAO_SECRET_PATH_OAUTH2_PROXY: ${BAO_SECRET_PATH_OAUTH2_PROXY:-oauth2-proxy/prod}
      BAO_SECRET_PATH_KEYCLOAK: ${BAO_SECRET_PATH_KEYCLOAK:-keycloak/prod}
    expose:
      - "3000"
    depends_on:
      - rustfs
    networks:
      - edge
      - internal

  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    environment:
      APP_HOST: ${APP_HOST}
      MEDIA_HOST: ${MEDIA_HOST}
      RUSTFS_ADMIN_HOST: ${RUSTFS_ADMIN_HOST}
      OAUTH2_PROXY_HOST: ${OAUTH2_PROXY_HOST}
    ports:
      - "${APP_HTTP_PORT:-80}:80"
      - "${APP_HTTPS_PORT:-443}:443"
    volumes:
      - ./caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - website
      - rustfs
      - oauth2-proxy
    networks:
      - edge
      - internal

  rustfs:
    image: rustfs/rustfs:latest
    command: server
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY}
    expose:
      - "9000"
      - "9001"
    volumes:
      - rustfs_data:/data
    networks:
      - internal

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1
    restart: unless-stopped
    command:
      - --http-address=0.0.0.0:4180
      - --provider=keycloak-oidc
      - --oidc-issuer-url=${KEYCLOAK_ISSUER}
      - --client-id=${OAUTH2_PROXY_CLIENT_ID}
      - --client-secret=${OAUTH2_PROXY_CLIENT_SECRET}
      - --cookie-secret=${OAUTH2_PROXY_COOKIE_SECRET}
      - --cookie-secure=true
      - --cookie-httponly=true
      - --cookie-samesite=lax
      - --email-domain=*
      - --redirect-url=${OAUTH2_PROXY_REDIRECT_URL}
      - --upstream=http://rustfs:9001
      - --scope=openid profile email roles
      - --skip-provider-button=true
      - --set-xauthrequest=true
      - --pass-access-token=true
      - --allowed-role=${OAUTH2_PROXY_ALLOWED_ROLE:-infra_admin}
      - --reverse-proxy=true
    expose:
      - "4180"
    depends_on:
      - rustfs
    networks:
      - internal

networks:
  edge:
  internal:

volumes:
  caddy_data:
  caddy_config:
  rustfs_data:
