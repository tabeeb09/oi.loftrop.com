services:
  website:
    image: ${WEBSITE_IMAGE:-website:latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      AUTH_SECRET: ${AUTH_SECRET}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-${AUTH_SECRET}}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_MEDIA_BASE_URL: ${NEXT_PUBLIC_MEDIA_BASE_URL}
      NEXT_PUBLIC_MEDIA_BUCKET: ${NEXT_PUBLIC_MEDIA_BUCKET:-public-media}
      NEXT_PUBLIC_MEDIA_KEY_PREFIX: ${NEXT_PUBLIC_MEDIA_KEY_PREFIX:-}
      FILE_STORAGE_PROVIDER: ${FILE_STORAGE_PROVIDER:-local}
      STORAGE_PROJECT: ${STORAGE_PROJECT:-portfolio}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET:-}
      S3_PRIVATE_BUCKET: ${S3_PRIVATE_BUCKET:-private-user-files}
      S3_PROJECT_KEY_PREFIX: ${S3_PROJECT_KEY_PREFIX:-}
      S3_PUBLIC_KEY_PREFIX: ${S3_PUBLIC_KEY_PREFIX:-}
      S3_PRIVATE_KEY_PREFIX: ${S3_PRIVATE_KEY_PREFIX:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-user-files}
      FILE_UPLOAD_MAX_BYTES: ${FILE_UPLOAD_MAX_BYTES:-262144000}
      FILE_ALLOWED_MIME_TYPES: ${FILE_ALLOWED_MIME_TYPES:-}
      FILE_ALLOWED_EXTENSIONS: ${FILE_ALLOWED_EXTENSIONS:-3mf,stl,obj,step,stp,iges,igs,ply,amf,gcode}
      KEYCLOAK_FILE_UPLOAD_LIMIT_CLAIMS: ${KEYCLOAK_FILE_UPLOAD_LIMIT_CLAIMS:-file_upload_limit_bytes,fileUploadLimitBytes}
      KEYCLOAK_FILE_ADMIN_ROLES: ${KEYCLOAK_FILE_ADMIN_ROLES:-owner,technician,print_admin,media_admin}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_REQUIRED_MEDIA_ROLES: ${KEYCLOAK_REQUIRED_MEDIA_ROLES:-owner,media_admin}
      KEYCLOAK_ROLE_CLAIM_PATH: ${KEYCLOAK_ROLE_CLAIM_PATH:-resource_access.website.roles}
      KEYCLOAK_ADMIN_REALM: ${KEYCLOAK_ADMIN_REALM}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-}
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET}
      OAUTH2_PROXY_REDIRECT_URL: ${OAUTH2_PROXY_REDIRECT_URL}
      BAO_ADDR: ${BAO_ADDR}
      BAO_KV_MOUNT: ${BAO_KV_MOUNT:-kv}
      BAO_SECRET_PATH_WEBSITE: ${BAO_SECRET_PATH_WEBSITE:-website/prod}
      BAO_SECRET_PATH_RUSTFS: ${BAO_SECRET_PATH_RUSTFS:-rustfs/prod}
      BAO_SECRET_PATH_OAUTH2_PROXY: ${BAO_SECRET_PATH_OAUTH2_PROXY:-oauth2-proxy/prod}
      BAO_SECRET_PATH_KEYCLOAK: ${BAO_SECRET_PATH_KEYCLOAK:-keycloak/prod}
      BAO_SECRET_PATH_SUPABASE: ${BAO_SECRET_PATH_SUPABASE:-supabase/prod}
      BAO_CONFIG_REQUEST_PATH: ${BAO_CONFIG_REQUEST_PATH:-caid/config-requests}
      BAO_APPROLE_AUTH_PATH: ${BAO_APPROLE_AUTH_PATH:-approle}
      OPENBAO_ROLE_ID: ${OPENBAO_ROLE_ID:-}
      OPENBAO_SECRET_ID: ${OPENBAO_SECRET_ID:-}
    expose:
      - "3000"
    networks:
      - edge

  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    environment:
      APP_HOST: ${APP_HOST}
    ports:
      - "${APP_HTTP_PORT:-80}:80"
      - "${APP_HTTPS_PORT:-443}:443"
    volumes:
      - ./caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - website
    networks:
      - edge

networks:
  edge:

volumes:
  caddy_data:
  caddy_config:
