name: CAId Converge From Website Runner

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/caid-converge-vps.yml"

permissions:
  contents: read

concurrency:
  group: caid-converge-from-website-runner
  cancel-in-progress: true

jobs:
  converge:
    runs-on: ${{ fromJSON(vars.DEPLOY_RUNNER_LABELS || '["self-hosted","linux","website-deploy","private-network"]') }}
    steps:
      - name: Converge CAId
        shell: bash
        run: |
          cd /srv/caid
          sudo git config --global --add safe.directory /srv/caid
          sudo git fetch --all --tags --prune
          sudo git checkout main
          sudo git reset --hard origin/main
          set +e
          sudo bash scripts/caid-converge.sh --mode noninteractive 2>&1 | tee /tmp/caid-converge.log
          status="${PIPESTATUS[0]}"
          set -e
          if test "$status" = "20"; then
            echo "CAId converge published pending human config requests."
            exit 0
          fi
          if test "$status" = "2" && grep -qi "Vault is sealed" /tmp/caid-converge.log; then
            echo "::warning::CAId converge skipped because OpenBao/Vault is sealed on the runner."
            exit 0
          fi
          exit "$status"
