name: Print Deploy To VPS

on:
  push:
    branches:
      - main
    paths:
      - "deployables/print-stage/**"
      - "scripts/bootstrap-print-vps.sh"
      - "scripts/prepare-print-env.mjs"
      - "scripts/seed-print-openbao-from-env.mjs"
      - "scripts/fetch-openbao-secrets.mjs"
      - ".github/workflows/print-deploy-vps.yml"
  workflow_dispatch:
    inputs:
      print_app_base_url:
        description: Base URL for the print app, used for initial OpenBao seed if missing from legacy env
        required: false
      stripe_secret_key:
        description: Stripe secret key, used only for initial OpenBao seed if missing from legacy env
        required: false
      stripe_webhook_secret:
        description: Stripe webhook secret, used only for initial OpenBao seed if missing from legacy env
        required: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: print-deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ${{ fromJSON(vars.DEPLOY_RUNNER_LABELS || '["self-hosted","linux","website-deploy","private-network"]') }}
    env:
      PRINT_DEPLOY_PATH: /srv/print/app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Request GitHub OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('https://github.com/${{ github.repository_owner }}');
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Sync print app to VPS workspace
        shell: bash
        run: |
          sudo install -d -m 755 "${PRINT_DEPLOY_PATH}"
          sudo rsync -a --delete \
            --exclude node_modules \
            --exclude .next \
            --exclude .env.local \
            "$GITHUB_WORKSPACE/deployables/print-stage/" "${PRINT_DEPLOY_PATH}/"

      - name: Bootstrap print runtime env from OpenBao
        shell: bash
        env:
          BAO_JWT_TOKEN: ${{ steps.oidc.outputs.token }}
          PRINT_APP_BASE_URL: ${{ inputs.print_app_base_url }}
          PRINT_STRIPE_SECRET_KEY: ${{ inputs.stripe_secret_key }}
          PRINT_STRIPE_WEBHOOK_SECRET: ${{ inputs.stripe_webhook_secret }}
        run: |
          sudo install -d -m 700 /etc/print
          sudo BAO_JWT_TOKEN="${BAO_JWT_TOKEN}" \
            PRINT_APP_BASE_URL="${PRINT_APP_BASE_URL}" \
            PRINT_STRIPE_SECRET_KEY="${PRINT_STRIPE_SECRET_KEY}" \
            PRINT_STRIPE_WEBHOOK_SECRET="${PRINT_STRIPE_WEBHOOK_SECRET}" \
            bash "$GITHUB_WORKSPACE/scripts/bootstrap-print-vps.sh"

      - name: Build and restart print app
        shell: bash
        run: |
          cd "${PRINT_DEPLOY_PATH}"
          sudo docker compose -p print \
            -f docker-compose.print.yaml \
            -f docker-compose.print.same-host-rustfs.yaml \
            up -d --build

      - name: Verify print site responds
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS https://print.loftrop.com >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "print.loftrop.com did not become healthy in time" >&2
          sudo docker compose -p print \
            -f "${PRINT_DEPLOY_PATH}/docker-compose.print.yaml" \
            -f "${PRINT_DEPLOY_PATH}/docker-compose.print.same-host-rustfs.yaml" \
            logs --tail 200 website >&2 || true
          exit 1
