name: Refresh Runtime Secrets

on:
  workflow_dispatch:
    inputs:
      secret_path:
        description: OpenBao path that changed
        required: false
  repository_dispatch:
    types:
      - secrets_changed

jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' || github.event.client_payload.source == 'openbao'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Request GitHub OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('https://github.com/${{ github.repository_owner }}');
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Refresh deployment on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          BAO_JWT_TOKEN: ${{ steps.oidc.outputs.token }}
          CHANGED_SECRET_PATH: ${{ github.event.client_payload.path || inputs.secret_path }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          envs: BAO_JWT_TOKEN,CHANGED_SECRET_PATH
          script: |
            set -eu
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch --all --prune
            git checkout main
            git pull --ff-only
            BAO_JWT_TOKEN="$BAO_JWT_TOKEN" npm run fetch:openbao-secrets
            docker compose up -d website oauth2-proxy rustfs caddy
